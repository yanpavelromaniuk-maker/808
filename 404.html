<!doctype html>
<html lang="ru" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#04070c">
  <title>404 — сигнал потерян</title>
  <meta name="description" content="Страница вышла из зоны наблюдения. Вернитесь на главную.">
  <meta name="robots" content="noindex, follow">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="404 — тут ничего необычного и обычного мало">
  <meta property="og:description" content="Эта страница вышла из зоны наблюдения. Вернитесь на главную.">
  <meta property="og:image" content="images/opt/sacebackgraund.webp">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/favicon.png">
  <link rel="preload" href="fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');</script>
</head>
<body
  class="error-page"
  data-page="error"
  data-title-ru="404 — тут ничего необычного и обычного мало"
  data-title-en="404 — nothing unusual here, and not much of the usual"
  data-desc-ru="Страница вышла из зоны наблюдения. Вернитесь на главную."
  data-desc-en="This page has left the observation area. Head back to the main page."
>
  <a class="skip-link" href="#main" data-ru="Перейти к содержанию" data-en="Skip to content">Перейти к содержанию</a>

  <div class="error-sky" aria-hidden="true"></div>
  <div class="error-vignette" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"></div>

  <header class="error-header">
    <div class="container error-header__inner">
      <a class="brand" href="index.html" aria-label="Ян, на главную" data-aria-ru="Ян, на главную" data-aria-en="Yan, back to home">
        <span class="brand__mark" aria-hidden="true"><span></span></span>
        <span class="brand__name" data-ru="ЯН" data-en="YAN">ЯН</span>
        <span class="brand__descriptor">ML × VET</span>
      </a>
      <div class="error-header__actions">
        <div class="lang-switch" role="group" aria-label="Язык сайта" data-aria-ru="Язык сайта" data-aria-en="Site language">
          <button class="lang-switch__button is-active" type="button" data-set-lang="ru" aria-pressed="true">RU</button>
          <span class="lang-switch__divider" aria-hidden="true">/</span>
          <button class="lang-switch__button" type="button" data-set-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="error-header__home" href="index.html" aria-label="На главную" data-aria-ru="На главную" data-aria-en="Back home">
          <span class="error-header__home-arrow" aria-hidden="true">←</span>
          <span data-ru="На главную" data-en="Back home">На главную</span>
        </a>
      </div>
    </div>
  </header>

  <main class="error-main" id="main" tabindex="-1">
    <div class="error-layout container">
      <figure class="error-planet" aria-hidden="true" data-depth="16">
        <span class="error-object-label">OBJ / 01</span>
        <span class="error-planet__halo"></span>
        <picture>
          <source srcset="images/opt/planet.webp" type="image/webp">
          <img src="images/planet.png" alt="" width="2500" height="2500" decoding="async" fetchpriority="high">
        </picture>
        <span class="error-object-meta">SATURN / FOCUS 42%</span>
      </figure>

      <div class="error-copy">
        <p class="eyebrow error-eyebrow">
          <span class="status-dot error-status-dot" aria-hidden="true"></span>
          <span>Navigation error / 404</span>
        </p>
        <h1
          class="error-title"
          aria-label="404 — тут ничего необычного и обычного мало"
          data-aria-ru="404 — тут ничего необычного и обычного мало"
          data-aria-en="404 — nothing unusual here, and not much of the usual"
        >
          <span class="error-code" aria-hidden="true"><span>4</span><span class="error-code__zero">0</span><span>4</span></span>
          <span class="error-message" data-ru="— тут ничего необычного и обычного мало" data-en="— nothing unusual here, and not much of the usual">— тут ничего необычного и обычного мало</span>
        </h1>
        <p class="error-lead" data-ru="Эта страница вышла из зоны наблюдения. Вернитесь на главную, там сигнал ещё ловится." data-en="This page has left the observation area. Head back to the main page, where the signal is still strong.">Эта страница вышла из зоны наблюдения. Вернитесь на главную, там сигнал ещё ловится.</p>
        <div class="error-actions">
          <a class="button button--primary" href="index.html">
            <span data-ru="Вернуться на главную" data-en="Back to the main page">Вернуться на главную</span>
            <span class="button__icon" aria-hidden="true">↗</span>
          </a>
          <span class="error-index" aria-hidden="true">ERR / 04:04</span>
        </div>
      </div>

      <figure class="error-cow" aria-hidden="true" data-depth="9">
        <span class="error-object-label">OBJ / 02</span>
        <div class="error-cow__scene">
          <picture class="error-cow__animal">
            <source srcset="images/opt/cow.webp" type="image/webp">
            <img src="images/cow.png" alt="" width="4000" height="4000" decoding="async" fetchpriority="high">
          </picture>
          <picture class="error-cow__laptop">
            <source srcset="images/opt/macbook.webp" type="image/webp">
            <img src="images/macbook.png" alt="" width="2500" height="2500" decoding="async">
          </picture>
          <span class="error-cow__glow" aria-hidden="true"></span>
        </div>
        <span class="error-object-meta">COW × MACBOOK / FIELD UNIT</span>
      </figure>
    </div>

    <footer class="error-footer container">
      <p><span data-ru="Ветеринария КРС" data-en="Dairy cattle veterinary">Ветеринария КРС</span> <span aria-hidden="true">×</span> CV / ML</p>
      <span class="error-footer__line" aria-hidden="true"></span>
      <p class="error-footer__signal"><span class="status-dot status-dot--small" aria-hidden="true"></span><span data-ru="Сигнал потерян" data-en="Signal lost">Сигнал потерян</span></p>
      <p class="error-footer__code">HTTP / 404</p>
    </footer>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
